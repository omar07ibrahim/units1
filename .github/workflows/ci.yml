name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measuretrace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_DATE_EPOCH: "1695295514"

jobs:
  quality:
    name: quality-and-reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Install hash-locked build backend
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run structural policy gate
        run: python tools/quality_gate.py
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Compile production and test modules
        run: python -m compileall -q -f measuretrace tests tools
      - name: Build wheel and source archive twice
        run: |
          mkdir -p build/one build/two
          python - <<'PY'
          from flit_core import buildapi

          for destination in ("build/one", "build/two"):
              buildapi.build_wheel(destination)
              buildapi.build_sdist(destination)
          PY
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digests(root):
              return {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path(root).iterdir())
                  if path.is_file()
              }

          first = digests("build/one")
          second = digests("build/two")
          if first != second:
              raise SystemExit(f"non-reproducible artifacts: {first!r} != {second!r}")
          for name, digest in first.items():
              print(f"{digest}  {name}")
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv build/clean-venv
          build/clean-venv/bin/python -m pip install --no-index build/one/measuretrace-*.whl
          build/clean-venv/bin/measuretrace convert 1 mi km --places 6
      - name: Upload independently reproducible packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measuretrace-packages-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/one/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  evidence:
    name: genuine-evidence
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Require runner-provided Chrome without installing software
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Generate evidence from the checked-out application
        run: |
          python -m tools.generate_evidence             --output evidence/staged             --ci-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify every evidence byte and semantic contract
        run: |
          python -m tools.verify_evidence             evidence/staged/manifest.json             --root evidence/staged             --expect-ci-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload evidence for review before repository adoption
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measuretrace-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/staged/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
