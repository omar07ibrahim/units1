<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Legacy approximation drift</title><desc id="desc">Difference between the original 1.60934 kilometre per mile factor and the exact NIST international mile definition.</desc><rect width="100%" height="100%" fill="#f5f3ea"/><text x="60" y="58" font-family="system-ui,sans-serif" font-size="32" font-weight="760" fill="#14211d">Legacy approximation drift</text><text x="60" y="88" font-family="system-ui,sans-serif" font-size="15" fill="#52615b">Original 1.60934 km/mi vs exact 1.609344 km/mi · computed by CI</text><line x1="100" y1="510.0" x2="1000" y2="510.0" stroke="#c9cec7" stroke-width="1"/><text x="82" y="515.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">0 m</text><line x1="100" y1="415.0" x2="1000" y2="415.0" stroke="#c9cec7" stroke-width="1"/><text x="82" y="420.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">100 m</text><line x1="100" y1="320.0" x2="1000" y2="320.0" stroke="#c9cec7" stroke-width="1"/><text x="82" y="325.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">200 m</text><line x1="100" y1="225.0" x2="1000" y2="225.0" stroke="#c9cec7" stroke-width="1"/><text x="82" y="230.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">300 m</text><line x1="100" y1="130.0" x2="1000" y2="130.0" stroke="#c9cec7" stroke-width="1"/><text x="82" y="135.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">400 m</text><polyline points="100.0,510.0 280.0,510.0 460.0,509.6 640.0,506.2 820.0,472.0 1000.0,130.0" fill="none" stroke="#195c45" stroke-width="4" stroke-linejoin="round"/><circle cx="100.0" cy="510.0" r="6" fill="#195c45"/><text x="100.0" y="542" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">1</text><circle cx="280.0" cy="510.0" r="6" fill="#195c45"/><text x="280.0" y="542" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">10</text><circle cx="460.0" cy="509.6" r="6" fill="#195c45"/><text x="460.0" y="542" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">100</text><circle cx="640.0" cy="506.2" r="6" fill="#195c45"/><text x="640.0" y="542" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">1000</text><circle cx="820.0" cy="472.0" r="6" fill="#195c45"/><text x="820.0" y="542" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">10000</text><circle cx="1000.0" cy="130.0" r="6" fill="#195c45"/><text x="1000.0" y="542" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#52615b">100000</text><text x="550.0" y="586" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#14211d">Input distance (international miles, log-spaced samples)</text></svg>
