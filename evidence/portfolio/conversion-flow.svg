<svg xmlns="http://www.w3.org/2000/svg" width="1265" height="420" viewBox="0 0 1265 420" role="img" aria-labelledby="title desc"><title id="title">Conversion and verification flow</title><desc id="desc">The rounded display is downstream of an exact rational result.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#195c45"/></marker></defs><rect width="100%" height="100%" fill="#f5f3ea"/><text x="48" y="64" font-family="system-ui,sans-serif" font-size="34" font-weight="760" fill="#14211d">Conversion and verification flow</text><text x="48" y="94" font-family="system-ui,sans-serif" font-size="16" fill="#52615b">The rounded display is downstream of an exact rational result.</text><path d="M120,210 L325,210" stroke="#195c45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M325,210 L530,210" stroke="#195c45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M530,210 L735,210" stroke="#195c45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M530,210 L940,210" stroke="#195c45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M735,210 L940,210" stroke="#195c45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M940,210 L1145,210" stroke="#195c45" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="165" width="170" height="90" rx="18" fill="#fffdf6" stroke="#8fa198" stroke-width="2"/><text x="53" y="203" font-family="system-ui,sans-serif" font-size="20" font-weight="720" fill="#14211d">Decimal input</text><text x="53" y="231" font-family="ui-monospace,monospace" font-size="13" fill="#52615b">bounded grammar</text><rect x="240" y="165" width="170" height="90" rx="18" fill="#fffdf6" stroke="#8fa198" stroke-width="2"/><text x="258" y="203" font-family="system-ui,sans-serif" font-size="20" font-weight="720" fill="#14211d">Exact parse</text><text x="258" y="231" font-family="ui-monospace,monospace" font-size="13" fill="#52615b">Decimal + Fraction</text><rect x="445" y="165" width="170" height="90" rx="18" fill="#fffdf6" stroke="#8fa198" stroke-width="2"/><text x="463" y="203" font-family="system-ui,sans-serif" font-size="20" font-weight="720" fill="#14211d">Unit factor</text><text x="463" y="231" font-family="ui-monospace,monospace" font-size="13" fill="#52615b">rational registry</text><rect x="650" y="165" width="170" height="90" rx="18" fill="#fffdf6" stroke="#8fa198" stroke-width="2"/><text x="668" y="203" font-family="system-ui,sans-serif" font-size="20" font-weight="720" fill="#14211d">Round display</text><text x="668" y="231" font-family="ui-monospace,monospace" font-size="13" fill="#52615b">explicit mode</text><rect x="855" y="165" width="170" height="90" rx="18" fill="#fffdf6" stroke="#8fa198" stroke-width="2"/><text x="873" y="203" font-family="system-ui,sans-serif" font-size="20" font-weight="720" fill="#14211d">Issue receipt</text><text x="873" y="231" font-family="ui-monospace,monospace" font-size="13" fill="#52615b">canonical JSON</text><rect x="1060" y="165" width="170" height="90" rx="18" fill="#fffdf6" stroke="#8fa198" stroke-width="2"/><text x="1078" y="203" font-family="system-ui,sans-serif" font-size="20" font-weight="720" fill="#14211d">Recompute</text><text x="1078" y="231" font-family="ui-monospace,monospace" font-size="13" fill="#52615b">independent verify</text></svg>
