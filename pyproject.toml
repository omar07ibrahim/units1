[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "measuretrace"
version = "0.1.0"
description = "Exact m/km/mi conversion with independently verifiable receipts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
measuretrace = "measuretrace.cli:main"

[tool.flit.sdist]
include = [
  "docs/",
  "legacy/",
  "tests/",
  "tools/",
  "requirements*.lock",
]
exclude = [
  "evidence/staged/",
]

[tool.ruff]
target-version = "py312"
line-length = 88
